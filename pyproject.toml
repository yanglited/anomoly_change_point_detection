[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "qdetector"
version = "1.0.0"
description = "Non-parametric multivariate change point / anomaly detection (spatial-sign quickest detector)"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.9"
authors = [{ name = "Yang Li" }]
keywords = ["change-point-detection", "anomaly-detection", "time-series", "nonparametric", "statistical-process-control", "quickest-detection"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Intended Audience :: Science/Research",
  "Topic :: Scientific/Engineering",
]
dependencies = ["numpy>=1.20", "plotly>=5"]

[project.urls]
Homepage = "https://yanglited.github.io/anomaly_change_point_detection/"
Repository = "https://github.com/yanglited/anomaly_change_point_detection"

[project.scripts]
qdetector = "qdetector:main"

[tool.setuptools]
py-modules = ["qdetector"]
